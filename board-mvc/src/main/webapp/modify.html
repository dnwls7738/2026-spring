<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<h1>게시글 수정</h1>
	<form action="/board-mvc/board/write" method="post" th:object="${boardVO}">
		<input type="hidden" value="${session.userVO.id}">
		<table border="1">
			<tr>
				<th>제목</th>
				<td><input type="text" th:field="*{title}" /> <span
					th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span></td>

			</tr>
			<tr>
				<th>작성자</th>
				<td>
				<input type="text" th:value="${session.userVO.id}" readonly name="writer"/>
				 <!-- <span th:field="${session.useVO.id}"> </span> -->
				<span th:if="${#fields.hasErrors('writer')}" th:errors="*{writer}"></span>
				</td>
			</tr>
			<tr>
				<th>내용</th>
				<td>
					<textarea rows="5" cols="10" th:field="*{content}"></textarea>
					<span th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></span>
				</td>
			</tr>
		</table>
		<button type = "submit">등록</button>
	</form>
</body>
</html>
