<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>

<body>
	<h1>전체 회원 목록 조회</h1>

	<table border="1">
		<tr>
			<th>아이디</th>
			<th>이름</th>
			<th>비밀번호</th>
		</tr>
		<tr th:each="member : ${memberList}">

			<th><a th:text="${member.id}" th:href="@{/members/mypage/{id} (id=${member.id})}"></a></th>
			<th th:text="${member.name}"></th>
			<th th:text="${member.password}"></th>

		</tr>
	</table>

</body>
</html>
