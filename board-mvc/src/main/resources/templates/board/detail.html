<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<script th:inline="javascript">


/* 게시판  */
document.addEventListener('DOMContentLoaded', function() {
	
	getReplyList()
	
	let listBtn = document.getElementById("lBtn")
	const mBtn = document.getElementById("mBtn")
	const dBtn = document.querySelector('#dBtn')
	
	// 목록이동
	listBtn.addEventListener('click', function() {
		location.href = /*[[@{/board}]]*/ ''
		//location.href = [[@{/board}]]
	})
	
	// 수정이동
	mBtn.addEventListener('click', function() {
		location.href = [[@{/board/modify/{no} (no=${board.no})}]]
	})

	
	// 삭제이동
	dBtn.addEventListener('click', async function() {
		// GET방식의 게시판삭제요청
		//location.href = [[@{/board/del/{no} (no=${board.no})}]]
		
		let response = await fetch(/*[[@{/board/{no} (no=${board.no})}]]*/ '/board-mvc/board/12', {
			method: 'delete'
		})
		
		if(response.ok) {
			alert('[[${board.no}]]번 게시글 삭제완료...')
			location.href = /*[[@{/board}]]*/ '/board-mvc/board'
		}
	})
})

/*댓글*/
document.addEventListener('DOMContentLoaded', function() {
	let replyAddBtn = document.getElementById('replyAddBtn')
	
	replyAddBtn.addEventListener('click', async function() {
		let writer = document.replyForm.writer
		let content = document.replyForm.content
		
		let response = await fetch([[@{/reply/{no} (no=${board.no})}]], {
			method: 'post',
			headers: {
				'content-type': 'application/x-www-form-urlencoded'
			},
			body : new URLSearchParams({
				content: content.value,
				writer: writer.value
				//,boardNo: /*[[${board.no}]]*/ 0
			})
		})
		
		if(response.ok) {
			writer.value = ''
			content.value = ''
			alert('댓글등록 성공')
			getReplyList()
		} else {
			alert('댓글등록 실패')
		}
		
	})
})

let getReplyList = async function () {
	let response = await fetch([[@{/reply/{no} (no=${board.no})}]])
	
	if(response.ok){
		response = await response.text()
		let replyList = JSON.parse(response)
		let replyDiv = document.querySelector('#replyList')
		replyList.forEach(function(reply){
			let data =''
			data += '<div>'
			data += '<strong>' +reply.content+ '</strong>(' +reply.writer + ')' 
			data += '<div>'
			replyDiv.innerHTML += '<h6>'+reply.content+'</h6>'
			console.log(reply)
		})
	}else{
		console.log("실패")
	}


}

</script>
<body>
	<h1>상세게시글</h1>
	<table border=1>
		<tr>
			<th>번호</th>
			<td th:text=${board.no}></td>
		</tr>
		<tr>
			<th>제목</th>
			<td th:text=${board.title}></td>
		</tr>
		<tr>
			<th>작성자</th>
			<td th:text=${board.writer}></td>
		</tr>
		<tr>
			<th>내용</th>
			<td th:text=${board.content}></td>
		</tr>
		<tr>
			<th>조회수</th>
			<td th:text=${board.ViewCnt}></td>
		</tr>
		<tr>
			<th>등록일</th>
			<td th:text=${board.regDate}></td>
		</tr>
	</table>
	<button id="dBtn">삭제</button>
	<button id="mBtn">수정</button>
	<button id="lBtn">목록</button>
	
	<form name="replyForm" >
	댓글 : <input type="text" name="content">
	작성자 : <input type="text" name="writer">
	<button type="button" id="replyAddBtn">댓글등록</button>
	</form>
	
	<div id="replyList">
		
	</div>

</body>

</html>
