<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<h2>전체 게시글 조회</h2>

	<table border="1">
		<tr>
			<th>번호</th>
			<th>제목</th>
			<th>작성자</th>
			<th>등록일</th>
		</tr>
		<tr th:each="board : ${boardList}">
			<th th:text="${board.no}">번호</th>
			<th th:text="${board.title}">제목</th>
			<th th:text="${board.writer}">작성자</th>
			<th th:text="${board.regDate}">등록일</th>
		</tr>
	</table>

</body>
</html>
