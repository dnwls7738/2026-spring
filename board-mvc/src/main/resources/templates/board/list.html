<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<script type="text/javascript">
	let gowrite = function() {
		location.href = "/board-mvc/board/write"
	}
</script>
<body>
	<h2>전체 게시글 조회</h2>
	<table border="1">
		<tr>
			<th>번호</th>
			<th>제목</th>
			<th>작성자</th>
			<th>등록일</th>
			<th>조회수</th>
		</tr>
		<tr th:each="board : ${boardList}">
			<td th:text="${board.no}">번호</td>
			<td>
			<a th:text="${board.title}" th:href="${session.userVO != null} ? @{/board/{no} (no=${board.no})} : @{/login}"></a>
			</td>
			<td th:text="${board.writer}">작성자</td>
			<td th:text="${board.regDate}">등록일</td>
			<td th:text="${board.viewCnt}">조회수</td>
		</tr>
	</table>
	<span th:if="${session.userVO.id != null}">
		<button onclick="gowrite()">새글등록</button>
	</span>
</body>

</html>
